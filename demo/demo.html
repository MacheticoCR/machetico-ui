<div class="docs-app" [attr.data-design]="appearance()">
	<a href="#contenido" class="skip-link" (click)="skipToContent($event)">Saltar al contenido</a>
	<header class="docs-topbar">
		<a routerLink="/" class="docs-brand"><span aria-hidden="true">m/</span> Machetico UI</a>
		<span class="docs-version" [attr.title]="'Revisión: ' + revision"
			>v{{ version }} · {{ revision }} · Angular ARIA first</span
		>
		<div class="docs-design">
			<machetico-select label="Estilo de diseño" [options]="designs" [(value)]="appearance" />
		</div>
		<button
			type="button"
			class="mobile-menu"
			macheticoButton="ghost"
			(click)="menuOpen.set(true)"
		>
			Menú
		</button>
	</header>
	<div class="docs-layout">
		<aside class="docs-sidebar" aria-label="Índice de documentación">
			<docs-navigation data-nav-id="desktop" />
			<p>Comportamiento compartido.<br />Identidad propia.</p>
		</aside>
		<main id="contenido" tabindex="-1"><router-outlet /></main>
	</div>
	<machetico-sidebar title="Documentación" [(open)]="menuOpen">
		<docs-navigation data-nav-id="mobile" (selected)="menuOpen.set(false)" />
	</machetico-sidebar>
</div>
