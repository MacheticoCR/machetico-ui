<div data-part="background" aria-hidden="true" [attr.data-playing]="playing()">
	<img data-part="poster" [class]="mediaClass()" [src]="poster()" alt="" /><video
		#video
		data-part="video"
		[class]="mediaClass()"
		[poster]="poster()"
		muted
		loop
		playsinline
		preload="none"
		tabindex="-1"
	></video>
</div>
