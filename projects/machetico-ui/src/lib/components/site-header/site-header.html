<header data-part="header">
	<div data-part="brand"><ng-content select="[headerBrand]" /></div>
	<button
		type="button"
		data-part="toggle"
		[hidden]="!interactive() || !collapsible()"
		[attr.aria-controls]="navigationId"
		[attr.aria-expanded]="open()"
		(click)="open.set(!open())"
	>
		{{ toggleLabel() }}
	</button>
	<nav
		data-part="navigation"
		[id]="navigationId"
		[attr.aria-label]="label()"
		[hidden]="interactive() && collapsible() && !open()"
	>
		<ng-content select="[headerLinks]" />
	</nav>
	<div data-part="actions"><ng-content select="[headerActions]" /></div>
</header>
