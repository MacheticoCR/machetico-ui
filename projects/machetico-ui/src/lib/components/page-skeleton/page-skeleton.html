<div data-part="div" role="status" aria-busy="true" i18n-aria-label aria-label="Cargando contenido">
	<div data-part="div-2" aria-hidden="true">
		@if (variant() !== 'section') {
			<div data-part="div-3">
				<span data-part="span"></span>
				<span data-part="span-2"></span>
			</div>
		}
		<div data-part="div-4">
			<span data-part="span-3"></span>
			<span data-part="span-4"></span>
			<span data-part="span-5"></span>
		</div>
		<div data-part="div-5">
			@for (card of cards(); track card) {
				<div data-part="div-6">
					<span data-part="span-6"></span>
					<span data-part="span-7"></span>
					<span data-part="span-8"></span>
				</div>
			}
		</div>
	</div>
</div>
