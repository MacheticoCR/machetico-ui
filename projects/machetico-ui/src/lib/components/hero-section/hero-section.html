<section data-part="hero">
	<div data-part="media" aria-hidden="true"><ng-content select="[heroMedia]" /></div>
	<div data-part="content">
		@if (eyebrow()) {
			<p data-part="eyebrow">{{ eyebrow() }}</p>
		}
		<h1>{{ title() }}</h1>
		<p>{{ description() }}</p>
		<div data-part="actions"><ng-content select="[heroActions]" /></div>
	</div>
</section>
