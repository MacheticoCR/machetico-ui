<dialog
	[attr.data-placement]="placement()"
	data-part="dialog"
	#dialog
	[attr.aria-labelledby]="titleId"
	[attr.data-side]="side()"
	aria-modal="true"
	[attr.aria-busy]="busy()"
	(cancel)="cancel($event)"
	(close)="handleClosed()"
	(click)="backdrop($event)"
>
	<header data-part="header">
		<h2 data-part="h2" [id]="titleId">{{ title() }}</h2>
		<button
			data-part="button"
			type="button"
			i18n-aria-label
			aria-label="Cerrar"
			[disabled]="busy()"
			(click)="close()"
		>
			<machetico-icon name="x" />
		</button>
	</header>
	<ng-content />
</dialog>
