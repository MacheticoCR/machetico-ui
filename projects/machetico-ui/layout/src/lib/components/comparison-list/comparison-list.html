<table data-part="comparison">
	<caption>
		{{
			caption()
		}}
	</caption>
	<thead>
		<tr>
			<th scope="col">Concepto</th>
			<th scope="col">{{ beforeLabel() }}</th>
			<th scope="col">{{ afterLabel() }}</th>
		</tr>
	</thead>
	<tbody>
		@for (item of items(); track item.id) {
			<tr>
				<th scope="row">{{ item.title }}</th>
				<td>{{ item.before }}</td>
				<td>{{ item.after }}</td>
			</tr>
		}
	</tbody>
</table>
