@if (!modal()) {
	<machetico-navigation-sidebar
		[title]="title()"
		[collapseBelow]="collapseBelow()"
		[headerClass]="headerClass()"
		[navigationClass]="navigationClass()"
		[toggleClass]="toggleClass()"
		[toggleLabel]="toggleLabel()"
		[(open)]="open"
	>
		<ng-content select="[sidebarBrand]" sidebarBrand />
		<ng-content select="[sidebarLinks]" sidebarLinks />
	</machetico-navigation-sidebar>
} @else if (open()) {
	<machetico-dialog
		[title]="title()"
		placement="sidebar"
		[side]="side()"
		[busy]="busy()"
		(closed)="dismiss()"
	>
		<div data-part="div"><ng-content /></div>
	</machetico-dialog>
}
